name: APK derle

on:
  push:
    branches-ignore: [apk-build, ci-log, ci-log-ios, ipa-build]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Birim testleri
        run: |
          set -o pipefail
          ./gradlew test --console=plain 2>&1 | tee /tmp/build.log

      - name: Debug APK derle
        run: |
          set -o pipefail
          ./gradlew assembleDebug --console=plain 2>&1 | tee -a /tmp/build.log

      # Hata olursa derleme çıktısını ve test raporlarını ci-log dalına yaz (git ile okunabilsin)
      - name: Hata kaydını yayınla
        if: failure()
        run: |
          mkdir -p /tmp/ci && cp /tmp/build.log /tmp/ci/ 2>/dev/null || true
          find app/build/test-results -name '*.xml' -exec cp {} /tmp/ci/ \; 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-log
          git rm -rf -q . || true
          git clean -fdxq
          cp /tmp/ci/* . 2>/dev/null || true
          git add -A
          git commit -q -m "CI hata kaydı: ${GITHUB_SHA::7}"
          git push -f origin ci-log

      - name: APK'yı adlandır
        run: cp app/build/outputs/apk/debug/app-debug.apk "toraksB-${GITHUB_REF_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: toraksB-debug-apk
          path: toraksB-*.apk

      # Telefondan tek tıkla indirmek için: Releases sayfasında doğrudan .apk
      - name: Release güncelle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}-apk"
          gh release delete "$TAG" -y --cleanup-tag || true
          gh release create "$TAG" "toraksB-${GITHUB_REF_NAME}.apk" \
            --target "$GITHUB_SHA" --prerelease \
            --title "toraksB ${GITHUB_REF_NAME} (debug APK)" \
            --notes "Araştırma prototipi. ${GITHUB_SHA::7} commit'inden otomatik derlendi."

      # APK'yı ayrı bir dalda da tut (git ile indirilebilsin)
      - name: apk-build dalına yaz
        run: |
          mkdir /tmp/out && cp "toraksB-${GITHUB_REF_NAME}.apk" /tmp/out/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-build
          git rm -rf -q .
          git clean -fdxq
          cp /tmp/out/*.apk .
          git add *.apk
          git commit -q -m "APK: ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}"
          git push -f origin apk-build

  # iOS: ortak testler, simülatörde açılış ekran görüntüsü ve iPhone için imzasız .ipa
  ios:
    runs-on: macos-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Ortak testler (iOS simülatörü)
        run: |
          set -o pipefail
          ./gradlew :shared:iosSimulatorArm64Test --console=plain 2>&1 | tee /tmp/ios.log
      - name: Xcode projesi oluştur
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate
      - name: Simülatör derlemesi
        run: |
          set -o pipefail
          cd iosApp
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build 2>&1 | tee -a /tmp/ios.log | tail -20
      - name: Simülatörde aç ve ekran görüntüsü al
        run: |
          mkdir -p /tmp/out
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find iosApp/build/sim -name "iosApp.app" -type d | head -1)
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.clkyigit.toraksb
          sleep 20
          xcrun simctl io "$UDID" screenshot /tmp/out/ios_ekran.png
      - name: iPhone derlemesi (imzasız .ipa)
        run: |
          set -o pipefail
          cd iosApp
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/dev ARCHS=arm64 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee -a /tmp/ios.log | tail -20
          APP=$(find build/dev -name "iosApp.app" -type d -path "*iphoneos*" | head -1)
          rm -rf /tmp/ipa && mkdir -p /tmp/ipa/Payload
          cp -R "$APP" /tmp/ipa/Payload/
          (cd /tmp/ipa && zip -qry /tmp/out/toraksB-${GITHUB_REF_NAME}.ipa Payload)
          ls -la /tmp/out
      - name: .ipa ve ekran görüntüsünü yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}-apk" /tmp/out/toraksB-${GITHUB_REF_NAME}.ipa --clobber || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ipa-build
          git rm -rf -q . || true
          git clean -fdxq
          cp /tmp/out/* .
          git add -A
          git commit -q -m "iOS: ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}"
          git push -f origin ipa-build
      - name: Hata kaydını yayınla
        if: failure()
        run: |
          mkdir -p /tmp/ci
          grep -E "error:|e: |FAILED|BUILD FAILED|\*\* BUILD" /tmp/ios.log > /tmp/ci/ios_errors.log || true
          tail -300 /tmp/ios.log > /tmp/ci/ios_tail.log || true
          cp /tmp/out/*.png /tmp/ci/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-log-ios
          git rm -rf -q . || true
          git clean -fdxq
          cp /tmp/ci/* .
          git add -A
          git commit -q -m "iOS hata kaydı: ${GITHUB_SHA::7}"
          git push -f origin ci-log-ios

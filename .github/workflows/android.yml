name: APK derle

on:
  push:
    branches-ignore: [apk-build, ci-log]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Birim testleri
        run: |
          set -o pipefail
          ./gradlew test --console=plain 2>&1 | tee /tmp/build.log

      - name: Debug APK derle
        run: |
          set -o pipefail
          ./gradlew assembleDebug --console=plain 2>&1 | tee -a /tmp/build.log

      # Hata olursa derleme çıktısını ve test raporlarını ci-log dalına yaz (git ile okunabilsin)
      - name: Hata kaydını yayınla
        if: failure()
        run: |
          mkdir -p /tmp/ci && cp /tmp/build.log /tmp/ci/ 2>/dev/null || true
          find app/build/test-results -name '*.xml' -exec cp {} /tmp/ci/ \; 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-log
          git rm -rf -q . || true
          git clean -fdxq
          cp /tmp/ci/* . 2>/dev/null || true
          git add -A
          git commit -q -m "CI hata kaydı: ${GITHUB_SHA::7}"
          git push -f origin ci-log

      - name: APK'yı adlandır
        run: cp app/build/outputs/apk/debug/app-debug.apk "toraksB-${GITHUB_REF_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: toraksB-debug-apk
          path: toraksB-*.apk

      # Telefondan tek tıkla indirmek için: Releases sayfasında doğrudan .apk
      - name: Release güncelle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}-apk"
          gh release delete "$TAG" -y --cleanup-tag || true
          gh release create "$TAG" "toraksB-${GITHUB_REF_NAME}.apk" \
            --target "$GITHUB_SHA" --prerelease \
            --title "toraksB ${GITHUB_REF_NAME} (debug APK)" \
            --notes "Araştırma prototipi. ${GITHUB_SHA::7} commit'inden otomatik derlendi."

      # APK'yı ayrı bir dalda da tut (git ile indirilebilsin)
      - name: apk-build dalına yaz
        run: |
          mkdir /tmp/out && cp "toraksB-${GITHUB_REF_NAME}.apk" /tmp/out/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-build
          git rm -rf -q .
          git clean -fdxq
          cp /tmp/out/*.apk .
          git add *.apk
          git commit -q -m "APK: ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}"
          git push -f origin apk-build

  # Ortak hesaplama kodunun testleri iOS simülatöründe (macOS)
  ios-shared:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Ortak testler (iOS simülatörü)
        run: ./gradlew :shared:iosSimulatorArm64Test --console=plain

name: iosApp
options:
  bundleIdPrefix: com.clkyigit
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  iosApp:
    type: application
    platform: iOS
    sources: [iosApp]
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: toraksB
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Compose Multiplatform yüksek yenileme hızı için gerekli
        CADisableMinimumFrameDurationOnPhone: true
        NSCameraUsageDescription: "BT konsol ekranının fotoğrafını çekmek için kamera kullanılır."
        NSPhotoLibraryUsageDescription: "Galeriden BT görüntüsü seçmek için kullanılır."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clkyigit.toraksb
        TARGETED_DEVICE_FAMILY: "1"
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework Shared"
        CODE_SIGN_STYLE: Automatic
    preBuildScripts:
      - name: Kotlin ortak kodu derle
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
